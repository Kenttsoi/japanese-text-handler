services:
  nginx:
    image: nginx:alpine
    container_name: japanese-text-handler-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - japanese-text-handler-network
    restart: always

  backend:
    build: ./backend
    container_name: japanese-text-handler-backend
    environment:
      - FLASK_ENV=production
      - FLASK_RUN_PORT=5000
      - PYTHONUNBUFFERED=1
      - VOICEVOX_URL=http://voicevox:50021

    networks:
      - japanese-text-handler-network
    restart: always

  frontend:
    build: ./frontend
    container_name: japanese-text-handler-frontend
    networks:
      - japanese-text-handler-network
    restart: always

  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    container_name: japanese-text-handler-voicevox
    networks:
      - japanese-text-handler-network
    restart: unless-stopped

networks:
  japanese-text-handler-network:
    driver: bridge